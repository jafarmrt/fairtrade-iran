<div class="form-row{% if field.field.widget.input_type == 'checkbox' %} form-row--check{% endif %}{% if field.errors %} has-error{% endif %}">
    {% if field.field.widget.input_type == 'checkbox' %}
        <label>{{ field }} <span>{{ field.label }}{% if field.field.required %} <span class="req" aria-hidden="true">*</span>{% endif %}</span></label>
    {% else %}
        <label for="{{ field.id_for_label }}">{{ field.label }}{% if field.field.required %} <span class="req" aria-hidden="true">*</span>{% endif %}</label>
        {{ field }}
    {% endif %}
    {% if field.help_text %}<div class="helptext">{{ field.help_text }}</div>{% endif %}
    {{ field.errors }}
</div>
