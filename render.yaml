# Free test copy of the site on Render (https://render.com), with demo data.
# Guide in Persian: docs/demo-fa.md. Not for the real site.
services:
  - type: web
    name: fairtrade-demo
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile.demo
    branch: main
    autoDeploy: true
    healthCheckPath: /robots.txt
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEMO_PASSWORD
        sync: false   # Render asks for it when the blueprint is created
