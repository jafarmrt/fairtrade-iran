# Production stack: PostgreSQL, the Django/Wagtail app, nginx in front and a
# daily backup job. The step-by-step guide is docs/deploy-fa.md.
#
#   cp .env.example .env            # fill it in
#   docker compose up -d --build
#   docker compose exec web python manage.py seed_content
#   docker compose exec web python manage.py createsuperuser
#
# HTTPS: run deploy/init-https.sh once, then set
# COMPOSE_FILE=docker-compose.yml:docker-compose.https.yml in .env.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fairtrade}
      POSTGRES_USER: ${POSTGRES_USER:-fairtrade}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fairtrade}"]
      interval: 5s
      retries: 10

  web:
    build:
      context: .
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-fairtrade}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-fairtrade}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - media:/app/media
      - private_media:/app/private_media

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on: [web]
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - media:/app/media:ro
      - certbot-www:/var/www/certbot:ro

  # Daily dump of the database plus both upload volumes into ./backups.
  # Copy ./backups off the server regularly (see docs/deploy-fa.md).
  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    entrypoint: ["/bin/sh", "/deploy/backup.sh"]
    environment:
      TZ: ${BACKUP_TZ:-Asia/Tehran}
      BACKUP_TIME: ${BACKUP_TIME:-03:30}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      PGHOST: db
      PGDATABASE: ${POSTGRES_DB:-fairtrade}
      PGUSER: ${POSTGRES_USER:-fairtrade}
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./deploy/backup.sh:/deploy/backup.sh:ro
      - ./backups:/backups
      - media:/data/media:ro
      - private_media:/data/private_media:ro

  # Only used by deploy/init-https.sh to get the first certificate;
  # docker-compose.https.yml runs the renewals.
  certbot:
    image: certbot/certbot:v3.1.0
    profiles: ["certbot"]
    volumes:
      - certbot-www:/var/www/certbot
      - letsencrypt:/etc/letsencrypt

volumes:
  pgdata:
  media:
  private_media:
  certbot-www:
  letsencrypt:
