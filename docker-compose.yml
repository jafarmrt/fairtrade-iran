# Production-like stack: PostgreSQL, the Django/Wagtail app, and nginx in front.
# Copy .env.example to .env, fill it in, then:
#   docker compose up -d --build
#   docker compose exec web python manage.py seed_content
#   docker compose exec web python manage.py createsuperuser

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fairtrade}
      POSTGRES_USER: ${POSTGRES_USER:-fairtrade}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fairtrade}"]
      interval: 5s
      retries: 10

  web:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-fairtrade}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-fairtrade}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - media:/app/media
      - private_media:/app/private_media

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on: [web]
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - media:/app/media:ro

volumes:
  pgdata:
  media:
  private_media:
