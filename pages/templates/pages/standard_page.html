{% extends "base.html" %}
{% load wagtailcore_tags wagtailimages_tags %}
{% block content %}
<header class="page-header">
    <div class="container">
        <h1>{{ page.title }}</h1>
        {% if page.intro %}<p class="lead">{{ page.intro }}</p>{% endif %}
    </div>
</header>
{% if page.cover_image %}<div class="page-cover">{% image page.cover_image fill-1600x500 %}</div>{% endif %}
<section class="section">
    <div class="container prose">{% include_block page.body %}</div>
</section>
{% endblock %}
