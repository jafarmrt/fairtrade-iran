name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: fairtrade
          POSTGRES_USER: fairtrade
          POSTGRES_PASSWORD: fairtrade
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U fairtrade"
          --health-interval 5s
          --health-retries 10
    env:
      DJANGO_SETTINGS_MODULE: fairtrade.settings.dev
      DATABASE_URL: postgres://fairtrade:fairtrade@localhost:5432/fairtrade
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Migrations are up to date
        run: python manage.py makemigrations --check --dry-run
      - run: python manage.py check
      - run: python manage.py test
      - name: Seed content runs twice (idempotent)
        run: |
          python manage.py migrate --noinput
          python manage.py seed_content
          python manage.py seed_content

  docker:
    name: Docker stack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Write a test .env
        run: |
          cat > .env <<'ENV'
          SECRET_KEY=ci-only-secret-key-not-used-anywhere-else
          ALLOWED_HOSTS=localhost
          CSRF_TRUSTED_ORIGINS=http://localhost
          SITE_URL=http://localhost
          USE_HTTPS=0
          POSTGRES_PASSWORD=ci-password
          EMAIL_BACKEND=django.core.mail.backends.console.EmailBackend
          ENV
      - name: Check compose files
        run: |
          docker compose config -q
          docker compose -f docker-compose.yml -f docker-compose.https.yml config -q
      - name: Build and start
        run: docker compose up -d --build --wait --wait-timeout 180 db web nginx
      - name: Seed content
        run: docker compose exec -T web python manage.py seed_content
      - name: Pages answer through nginx
        run: |
          # The app runs migrations before gunicorn starts; wait for it.
          for i in $(seq 1 30); do
            curl -sf -o /dev/null http://localhost/fa/ && break
            sleep 2
          done
          for path in /fa/ /en/ /admin/login/ /static/css/fairtrade.css; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "http://localhost$path")
            echo "$path $code"
            [ "$code" = 200 ] || exit 1
          done
      - name: Backup runs
        run: |
          docker compose run --rm backup now
          sudo ls -l backups/*/
          sudo sh -c 'test -s backups/*/db.dump && test -s backups/*/media.tar.gz'
      - name: Logs on failure
        if: failure()
        run: docker compose logs
