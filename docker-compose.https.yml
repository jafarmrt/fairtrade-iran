# HTTPS on top of docker-compose.yml, with a Let's Encrypt certificate that
# renews itself. Get the first certificate with deploy/init-https.sh, then add
#   COMPOSE_FILE=docker-compose.yml:docker-compose.https.yml
# to .env so every "docker compose" command uses both files.

services:
  nginx:
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./deploy/nginx-https.conf:/etc/nginx/conf.d/default.conf:ro
      - letsencrypt:/etc/letsencrypt:ro
    # Reload every 6 hours so a renewed certificate is picked up.
    command: ["/bin/sh", "-c", "while :; do sleep 6h; nginx -s reload; done & exec nginx -g 'daemon off;'"]

  # Renews the certificate twice a day when it is close to expiring.
  certbot-renew:
    image: certbot/certbot:v3.1.0
    restart: unless-stopped
    volumes:
      - certbot-www:/var/www/certbot
      - letsencrypt:/etc/letsencrypt
    entrypoint: ["/bin/sh", "-c", "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done"]

volumes:
  certbot-www:
  letsencrypt:
