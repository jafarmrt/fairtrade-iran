# Used by docker-compose.cdn.yml: the site behind Parspack's CDN, which gives
# visitors HTTPS (its own certificate) and talks to this server over plain HTTP.
#
# Requests that come from Parspack's addresses (deploy/cdn/, refreshed by
# deploy/cdn/update-ips.sh) are treated as HTTPS, and the visitor's own address
# is taken from X-Forwarded-For, so the sign-in limits (core/throttle.py) count
# each visitor and not the CDN. Anyone else reaching the server's IP directly is
# treated as plain HTTP, so their forwarded headers are ignored.

geo $realip_remote_addr $from_cdn {
    default 0;
    include /etc/nginx/cdn/cdn-ips.geo;
}

map $from_cdn $forwarded_proto {
    1       https;
    default $scheme;
}

server {
    listen 80;
    server_name _;
    client_max_body_size 30m;

    include /etc/nginx/cdn/real-ip.conf;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # Compress pages and data on the way out (static files are pre-compressed by WhiteNoise).
    gzip on;
    gzip_proxied any;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

    # Let's Encrypt domain check, if a certificate is ever taken on this server instead.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Public uploads only. Private application files live in a separate
    # volume that nginx never sees.
    location /media/ {
        alias /app/media/;
        expires 30d;
        add_header X-Content-Type-Options nosniff;
    }

    location / {
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        # One address: the visitor as nginx resolved it (the CDN's header only when the request came from the CDN).
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_read_timeout 60s;
    }
}
