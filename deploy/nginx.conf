server {
    listen 80;
    server_name _;
    client_max_body_size 30m;

    # Compress pages and data on the way out (static files are pre-compressed by WhiteNoise).
    gzip on;
    gzip_proxied any;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;


    # Public uploads (images, page media). Private application files live in
    # a separate volume that nginx never sees.
    # Let's Encrypt domain check (deploy/init-https.sh).
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location /media/ {
        alias /app/media/;
        expires 30d;
        add_header X-Content-Type-Options nosniff;
    }

    location / {
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
