# Used by docker-compose.https.yml. The certificate is stored under the fixed
# name "site" by deploy/init-https.sh, so this file needs no domain name.

server {
    listen 80;
    server_name _;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;
    client_max_body_size 30m;

    ssl_certificate     /etc/letsencrypt/live/site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/site/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=15768000" always;

    # Public uploads only. Private application files live in a separate
    # volume that nginx never sees.
    location /media/ {
        alias /app/media/;
        expires 30d;
        add_header X-Content-Type-Options nosniff;
        add_header Strict-Transport-Security "max-age=15768000" always;
    }

    location / {
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }
}
