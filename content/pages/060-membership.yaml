fa:
  title: عضویت
  slug: membership
  intro: به شبکه‌ای از تولیدکنندگان، نهادها و حامیانی بپیوندید که به اصول ده‌گانه تجارت عادلانه پایبندند.
  body:
  - cards:
      heading: عضویت در خانه چه می‌دهد؟
      cards:
      - title: تجمیع توان و منابع
        text: نمایشگاه‌ها، آموزش‌ها و امکانات مشترکی که دسترسی به آن‌ها به‌تنهایی دشوار است.
      - title: نشان معتبر
        text: اعضای رسمی می‌توانند از نشان خانه برای معرفی و جلب اعتماد استفاده کنند.
      - title: بازارهای تازه
        text: فروش در فروشگاه خانه و اتصال به خریداران آگاه و فرصت‌های صادراتی.
      - title: شبکه‌سازی و یادگیری
        text: تبادل تجربه، آموزش و همکاری‌های مشترک میان اعضا.
      - title: کاهش هزینه و ریسک
        text: سازوکارهای جمعی برای تبلیغات، آموزش و تأمین مواد اولیه.
      - title: صدا در تصمیم‌ها
        text: اعضای رسمی در مجمع عمومی حق رأی دارند و می‌توانند نامزد ارکان شوند.
  producer_text: فرد، کارگاه، تعاونی یا بنگاه کوچکی که خود کالا یا خدمتی تولید می‌کند و فعالیت اصلی آن تولید است؛ با اولویت تولیدکنندگان خرد و گروه‌های محروم از دسترسی برابر به بازار.
  institution_text: شخص حقوقی غیرانتفاعی (سازمان مردم‌نهاد، بنیاد، انجمن یا مرکز علمی) که تجارت محصولات فعالیت اصلی آن نیست، اما از راه آموزش، تأمین مالی، پژوهش یا حمایتگری از تجارت عادلانه پشتیبانی می‌کند.
  network_text: تشکل ملی، منطقه‌ای یا موضوعی متشکل از چند سازمان یا تولیدکننده که هدف آن هماهنگی، نمایندگی و ترویج تجارت عادلانه میان اعضای خود است.
  individual_text: شخص حقیقی که به اصول تجارت عادلانه پایبند است و با دانش، وقت یا منابع مالی خود از آن حمایت می‌کند، بدون آنکه نماینده شخص حقوقی باشد.
  fees_note: <p>مبالغ را مجمع عمومی تعیین می‌کند. هزینه درخواست مستقل از نتیجه و غیرقابل استرداد است.</p>
  process_heading: مراحل پذیرش
  process_steps:
  - step:
      title: درخواست
      text: فرم عضویت را پر کنید، مدارک را پیوست کنید و هزینه درخواست را بپردازید. کد پیگیری به ایمیل شما فرستاده می‌شود.
  - step:
      title: کنترل مدارک
      text: دبیرخانه ظرف {secretariat_days} روز کامل بودن پرونده را بررسی می‌کند و آن را به کمیسیون نظارتی می‌فرستد.
  - step:
      title: ارزیابی
      text: کمیسیون نظارتی ظرف {commission_days} روز ارزیابی اسنادی را انجام می‌دهد. برای تولیدکنندگان، بازدید میدانی نیز الزامی است.
  - step:
      title: رأی کمیسیون
      text: یکی از سه حالت «پذیرش آزمایشی»، «درخواست اصلاح» یا «رد مستدل»؛ دبیرخانه رأی را به شما ابلاغ می‌کند.
  - step:
      title: دوره آزمایشی
      text: '{trial_months} ماه، با دسترسی به آموزش‌ها و خدمات پایه. اعضای آزمایشی حق رأی، نامزدی و استفاده از نشان خانه را ندارند.'
  - step:
      title: ارزیابی پایانی
      text: کمیسیون در پایان دوره یکی از سه رأی «تبدیل به عضو رسمی»، «تمدید یک‌باره» یا «عدم پذیرش» را صادر می‌کند.
  - step:
      title: ثبت و گواهی
      text: دبیرخانه عضو رسمی را ثبت و گواهی عضویت صادر می‌کند. اعتبار گواهی را هر کسی در همین سایت می‌تواند استعلام کند.
  conditions: <ol><li>فعالیت واقعی و مستند در گروه مربوط.</li><li>امضای تعهدنامه رعایت اصول ده‌گانه تجارت عادلانه.</li><li>پذیرش کتبی بازرسی‌های دوره‌ای و سرزده، برای تولیدکنندگان.</li><li>ارائه اطلاعات شفاف درباره نیروی کار، دستمزد و زنجیره تأمین، برای تولیدکنندگان.</li><li>پرداخت هزینه درخواست عضویت و حق عضویت سالانه.</li></ol>
  form_intro: <p>لطفاً فرم را با دقت پر کنید. پرسش‌های ستاره‌دار اجباری‌اند. پس از ارسال، کد پیگیری به ایمیل شما فرستاده می‌شود.</p>
  payment_text: <p>هزینه درخواست را به حساب زیر واریز کنید و تصویر رسید را پیوست کنید.</p>
  commitment_text: '<p>با ارسال این درخواست متعهد می‌شوم اصول ده‌گانه تجارت عادلانه را رعایت کنم: ایجاد فرصت برای تولیدکنندگان محروم، شفافیت و پاسخگویی، رویه‌های تجاری منصفانه، پرداخت منصفانه، منع کار کودک و کار اجباری، عدم تبعیض و برابری جنسیتی و آزادی تشکل، شرایط کاری ایمن و مناسب، ظرفیت‌سازی، ترویج تجارت عادلانه و احترام به محیط زیست. می‌دانم که کمیسیون نظارتی بر اجرای این اصول نظارت می‌کند.</p>'
  inspection_text: بازرسی‌های دوره‌ای و سرزده خانه را می‌پذیرم و اطلاعات نیروی کار، دستمزد و زنجیره تأمین را شفاف در اختیار کمیسیون می‌گذارم.
  privacy_text: مدارک شما محرمانه است و فقط دبیرخانه و کمیسیون نظارتی آن‌ها را می‌بینند.
  success_text: <p>سپاس از اعتماد شما. هر مرحله از بررسی پرونده با ایمیل به شما خبر داده می‌شود و وضعیت را هر زمان در صفحه پیگیری می‌بینید.</p>
  closed_text: <p>در حال حاضر درخواست عضویت تازه پذیرفته نمی‌شود. برای اطلاع از زمان بازگشایی با دبیرخانه در تماس باشید.</p>
  track_intro: <p>کد پیگیری و ایمیلی را که در فرم نوشتید وارد کنید تا وضعیت پرونده را ببینید.</p>
  certificate_intro: <p>شماره گواهی عضویت را وارد کنید تا ببینید معتبر است یا نه.</p>
en:
  title: Membership
  slug: membership
  intro: Join a network of producers, organisations and supporters committed to the ten principles of fair trade.
  body:
  - cards:
      heading: What membership offers
      cards:
      - title: Pooled strength
        text: Shared exhibitions, training and resources that are hard to reach alone.
      - title: A trusted mark
        text: Full members may use the House's mark to build visibility and trust.
      - title: New markets
        text: Sales through the House's shop, conscious buyers and export opportunities.
      - title: Network and learning
        text: Exchange of experience, training and joint projects among members.
      - title: Lower costs and risks
        text: Shared mechanisms for advertising, training and sourcing raw materials.
      - title: A voice in decisions
        text: Full members vote in the General Assembly and can stand for its bodies.
  producer_text: An individual, workshop, cooperative or small business that makes its own goods or services as its main activity; small producers and groups without equal market access come first.
  institution_text: A non-profit legal entity (NGO, foundation, association or research centre) whose main activity is not trading products, but which supports fair trade through training, funding, research or advocacy.
  network_text: A national, regional or thematic body of several organisations or producers that coordinates, represents and promotes fair trade among its members.
  individual_text: A person committed to the principles of fair trade who supports it with knowledge, time or money, without representing a legal entity.
  fees_note: <p>Amounts are set by the General Assembly. The application fee is non-refundable, whatever the outcome.</p>
  process_heading: How admission works
  process_steps:
  - step:
      title: Application
      text: Fill in the form, attach your documents and pay the application fee. A tracking code is e-mailed to you.
  - step:
      title: Document check
      text: Within {secretariat_days} days the secretariat checks that the file is complete and sends it to the Supervisory Commission.
  - step:
      title: Evaluation
      text: Within {commission_days} days the commission evaluates the documents. For producers a field visit is also required.
  - step:
      title: Commission decision
      text: Trial acceptance, a request for changes, or a reasoned rejection; the secretariat informs you.
  - step:
      title: Trial period
      text: '{trial_months} months with access to training and basic services. Trial members cannot vote, stand for election or use the House''s mark.'
  - step:
      title: Final evaluation
      text: 'At the end of the trial the commission decides: full membership, a one-off extension, or not accepted.'
  - step:
      title: Registration and certificate
      text: The secretariat registers the full member and issues a membership certificate, which anyone can check on this site.
  conditions: <ol><li>Real, documented activity in the relevant group.</li><li>Signing the commitment to the ten principles of fair trade.</li><li>Written acceptance of periodic and unannounced inspections (producers).</li><li>Transparent information on workforce, wages and supply chain (producers).</li><li>Payment of the application fee and the annual membership fee.</li></ol>
  form_intro: <p>Please fill in the form carefully. Questions marked with a star are required. After sending, a tracking code is e-mailed to you.</p>
  payment_text: <p>Pay the application fee to the account below and attach a picture of the receipt.</p>
  commitment_text: '<p>By sending this application I commit to the ten principles of fair trade: opportunities for disadvantaged producers, transparency and accountability, fair trading practices, fair payment, no child or forced labour, non-discrimination, gender equity and freedom of association, good working conditions, capacity building, promoting fair trade, and respect for the environment. I understand that the Supervisory Commission monitors how these principles are applied.</p>'
  inspection_text: I accept periodic and unannounced inspections by the House and will share clear information on our workforce, wages and supply chain with the commission.
  privacy_text: Your documents are confidential and are seen only by the secretariat and the Supervisory Commission.
  success_text: <p>Thank you. You will receive an e-mail at each step, and you can check the status at any time on the tracking page.</p>
  closed_text: <p>We are not accepting new applications at the moment. Please contact the secretariat to find out when they reopen.</p>
  track_intro: <p>Enter your tracking code and the e-mail you used in the form to see the status of your file.</p>
  certificate_intro: <p>Enter a membership certificate number to check whether it is valid.</p>
