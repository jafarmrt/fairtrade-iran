    {message}

    با احترام،
    دبیرخانه {site_name}
  subject_en: Your membership has been reinstated
  body_en: |-
    Dear {name},

    The decision to cancel your membership was overturned on appeal and your membership continues.

    {message}

    Kind regards,
    Secretariat, {site_name}
standing_digest:
