# SMS texts, Persian (text) and English (text_en). One block per event; the event name and
# "label" (how it is listed in the admin panel) are fixed. Words in {braces} are filled in
# when the SMS is sent: keep them exactly as they are. Keep messages short (one SMS is
# about 70 Persian characters).
# These texts can also be edited in the admin panel: پیامک → متن‌های پیامک.
assembly_invitation:
  label: 'مجمع عمومی، به عضو: دعوت‌نامه'
  text: |-
    {name} گرامی، به {assembly} در {date} دعوت شده‌اید. دستور جلسه و رأی‌گیری در پنل اعضا:
    {panel_url}
    {site_name}
  text_en: |-
    Dear {name}, you are invited to the {assembly} on {date}. Agenda and voting in the member panel:
    {panel_url}
    Fair Trade House of Iran
assembly_reminder:
  label: 'مجمع عمومی، به عضو: یادآوری پیش از جلسه'
  text: |-
    {name} گرامی، {assembly} در {date} برگزار می‌شود.
    {panel_url}
    {site_name}
  text_en: |-
    Dear {name}, the {assembly} takes place on {date}.
    {panel_url}
    Fair Trade House of Iran
assembly_results:
  label: 'مجمع عمومی، به عضو: اعلام نتایج'
  text: |-
